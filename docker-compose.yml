services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: mazlove_db
      POSTGRES_USER: ${DB_USERNAME:-mazlove}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mazlove_secret}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
        required: false # Compose >= 2.20 : le backend démarre aussi sans le profil dev
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      OSRM_BASE_URL: ${OSRM_BASE_URL:-https://router.project-osrm.org}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      TRACKING_ARRIVAL_RADIUS_M: ${TRACKING_ARRIVAL_RADIUS_M:-50}
      TRACKING_SIGNAL_LOST_AFTER_S: ${TRACKING_SIGNAL_LOST_AFTER_S:-45}
      DATABASE_URL: jdbc:postgresql://postgres:5432/mazlove_db
      DB_USERNAME: ${DB_USERNAME:-mazlove}
      DB_PASSWORD: ${DB_PASSWORD:-mazlove_secret}
      SPRING_SQL_INIT_DATA_LOCATIONS: classpath:sql/seed.sql
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secret}
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_in_production_32chars}
      ALLOWED_ORIGINS: http://localhost:3000
      MAIL_HOST: ${MAIL_HOST:-mailhog}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "-q", "-O", "/dev/null", "http://127.0.0.1:3001/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_DEMO: ${VITE_DEMO:-true}
        VITE_MAP_STYLE_URL: ${VITE_MAP_STYLE_URL:-https://tiles.openfreemap.org/styles/liberty}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

  # Outils de développement : profil "dev" (activé par défaut via le Makefile).
  # Hors profil dev, définir MAIL_HOST/MAIL_PORT vers un vrai SMTP.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    profiles: [dev]
    ports:
      - "1025:1025"
      - "8025:8025"

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    profiles: [routing]
    volumes:
      - ./osrm-data:/data
    command: osrm-routed --algorithm mld /data/ile-de-france-latest.osrm
    ports:
      - "5000:5000"

  pgadmin:
    image: dpage/pgadmin4:9.18
    profiles: [dev]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@mazlove.fr}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data:
  uploads_data:
