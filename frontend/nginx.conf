server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;
    add_header Referrer-Policy "no-referrer" always;

    # Bearer links are secrets: do not write them in access/error logs or referrers.
    location ^~ /api/public/trips/ {
        access_log off;
        error_log /dev/null;
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location ^~ /t/ {
        access_log off;
        error_log /dev/null;
        try_files /index.html =404;
    }

    # Compression : le chunk de la carte passe d'environ 800 Ko à 220 Ko.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Fichiers produits par Vite : leur nom contient un hash, ils peuvent être mis en cache longtemps.
    location /assets/ {
        # Un add_header dans un location annule ceux du bloc server : on répète Referrer-Policy.
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /uploads/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /ws {
        proxy_read_timeout 3600s;
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
