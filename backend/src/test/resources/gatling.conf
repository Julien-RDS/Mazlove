# Surcharges de la configuration Gatling 3.9 (les autres valeurs restent celles par défaut).
# Format HOCON : l'ancien fichier contenait une syntaxe "a" -> "b" invalide qui empêchait Gatling de démarrer.
gatling {
  core {
    encoding = "utf-8"
  }
  http {
    # Délai maximal d'une requête, en millisecondes : au-delà, elle compte comme une erreur.
    requestTimeout = 30000
  }
  data {
    # Résultats dans la console et dans target/gatling (rapport HTML).
    writers = [console, file]
  }
}
