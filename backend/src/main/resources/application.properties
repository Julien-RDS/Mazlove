# ═════════════════════════════════════════════════════════════════════════════
# Configuration Mazlove (profil par défaut = développement local)
# Tous les secrets passent par des variables d'environnement, avec une valeur de
# repli après les ":" utilisable en local uniquement.
# ═════════════════════════════════════════════════════════════════════════════

# Lit aussi un fichier .env (format CLE=valeur) placé dans le dossier d'où l'on lance
# l'application (backend/ avec "mvn spring-boot:run"). Copier .env.example pour démarrer.
spring.config.import=optional:file:.env[.properties]

# ─── Serveur ─────────────────────────────────────────────────────────────────
server.port=${PORT:3001}

# ─── Base de données (PostgreSQL) ────────────────────────────────────────────
# La base doit exister (createdb mazlove_db) ; les tables sont créées au démarrage.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/mazlove_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── Création du schéma ──────────────────────────────────────────────────────
# schema.sql est idempotent (IF NOT EXISTS) : le rejouer à chaque démarrage ne casse rien.
# Il s'exécute AVANT Hibernate, qui vérifie ensuite que les entités collent aux tables.
# Mettre DB_INIT_MODE=never quand le schéma est géré par un outil de migration.
spring.sql.init.mode=${DB_INIT_MODE:always}
spring.sql.init.schema-locations=classpath:sql/schema.sql
spring.sql.init.encoding=UTF-8

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
# "validate" : Hibernate ne modifie jamais les tables, il refuse de démarrer si une
# colonne manque (message explicite au lieu d'une erreur SQL au premier appel).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=false
# Les DTO sont construits dans les services (@Transactional) : pas besoin de garder la
# session Hibernate ouverte jusqu'à la vue, ce qui masquait des requêtes N+1.
spring.jpa.open-in-view=false

# ─── Redis (codes OTP + cache) ───────────────────────────────────────────────
# Spring Boot 3 lit spring.data.redis.* (l'ancien préfixe spring.redis.* est ignoré).
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=0
spring.cache.type=redis
# Durée de vie des listes mises en cache (lue par RedisConfig).
spring.cache.redis.time-to-live=${CACHE_TTL:10m}

# ─── Double authentification ─────────────────────────────────────────────────
# true = le code de connexion est écrit dans les logs. Pratique en local tant qu'aucun
# envoi email/SMS n'est branché ; doit rester à false partout ailleurs.
mfa.dev-log-otp=${MFA_DEV_LOG_OTP:false}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
upload.dir=${UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ─── CORS ────────────────────────────────────────────────────────────────────
# Origines autorisées, séparées par des virgules (aussi utilisées par le WebSocket).
cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

# ─── JWT ─────────────────────────────────────────────────────────────────────
# OBLIGATOIRE hors local : JWT_SECRET d'au moins 32 caractères (openssl rand -base64 48).
# La valeur de repli ci-dessous déclenche un avertissement au démarrage.
jwt.secret=${JWT_SECRET:CHANGE_ME_IN_PRODUCTION_USE_ENV_VAR}
# Durée de validité du jeton en millisecondes (7 jours par défaut).
jwt.expiration=${JWT_EXPIRATION:604800000}

# ─── Documentation OpenAPI ───────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha

# ─── Logs ────────────────────────────────────────────────────────────────────
# Les niveaux fins et la rotation des fichiers sont dans logback-spring.xml.
logging.level.root=INFO
logging.level.com.mazlove=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
