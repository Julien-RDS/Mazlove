# ═════════════════════════════════════════════════════════════════════════════
# Profil production : activé avec SPRING_PROFILES_ACTIVE=prod.
# Ne contient que ce qui DIFFÈRE du profil par défaut (application.properties).
# (L'ancien fichier était écrit en YAML sous une extension .properties : rien n'était pris en compte.)
# ═════════════════════════════════════════════════════════════════════════════

server.port=${PORT:8080}

# Le schéma est géré par l'équipe (migration contrôlée), jamais rejoué automatiquement.
spring.sql.init.mode=never

# Jamais de code OTP dans les logs de production, quelle que soit la variable d'environnement.
mfa.dev-log-otp=false

# Pas de documentation publique de l'API en production.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Messages d'erreur : uniquement ceux de GlobalExceptionHandler, jamais de trace Java.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Logs : fichiers datés et fichier d'erreurs séparé, cf. logback-prod.xml.
logging.config=classpath:logback-prod.xml
logging.level.root=WARN
logging.level.com.mazlove=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=ERROR
