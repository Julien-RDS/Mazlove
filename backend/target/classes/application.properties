# Server configuration
server.port=3001

# Database configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/mazlove_db
spring.datasource.username=postgres
spring.datasource.password=your_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Redis Configuration
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password=
spring.redis.database=0
spring.cache.type=redis
spring.cache.redis.time-to-live=600000  # 10 minutes

# CORS configuration
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=*
spring.web.cors.allowed-headers=*

# JWT Configuration
jwt.secret=ChangeThisSecretInProduction
jwt.expiration=604800000  # 7 jours en millisecondes

# Log Configuration
logging.level.root=INFO
logging.level.com.mazlove=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO

# Log File Configuration
logging.file.name=mazlove.log
logging.file.max-size=10MB
logging.file.max-history=30
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
