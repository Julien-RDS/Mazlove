gatling {
  core {
    # Nombre de threads pour l'exécution des tests
    core-count = 4
    
    # Durée maximale d'exécution d'un scénario
    max-duration = 1 hour
    
    # Taille maximale des corps de requêtes
    max-request-body-size = 10000000
  }
  
  http {
    # Configuration des timeouts
    connect-timeout = 30 seconds
    response-timeout = 30 seconds
    
    # Configuration des headers par défaut
    default-headers = [
      "Accept" -> "application/json",
      "Content-Type" -> "application/json"
    ]
  }
  
  # Configuration des rapports
  reports {
    # Format des rapports
    format = "html"
    
    # Dossier des rapports
    output-directory = "target/gatling"
    
    # Fichiers à inclure dans les rapports
    include = [
      "*.html",
      "*.js",
      "*.css",
      "*.png"
    ]
  }
}
